name: rccl multi node tests

on:
  push:
    branches:
      - 'users/arravikum/multi-node-rccl-tests'

  workflow_dispatch:
    inputs:
      package_version:
        type: string
        default: ADHOCBUILD
      amdgpu_families:
        type: string
      expect_failure:
        type: boolean
        default: false
      extra_cmake_options:
        type: string

  workflow_call:
    inputs:
      package_version:
        type: string
        default: ADHOCBUILD
      amdgpu_families:
        type: string
      expect_failure:
        type: boolean
        default: false
      extra_cmake_options:
        type: string


permissions:
  contents: read

jobs:
  build_test_packages:
    #if: false
    name: Build test packages
    runs-on: azure-linux-scale-rocm
    continue-on-error: false
    permissions:
      id-token: write
    container:
      image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:543ba2609de3571d2c64f3872e5f1af42fdfa90d074a7baccb1db120c9514be2
    strategy:
      fail-fast: true
    env:
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      # The ccache.conf will be written by setup_ccache.py before this gets used.
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf
      AMDGPU_FAMILIES: 'gfx94X-dcgpu'
      TEATIME_FORCE_INTERACTIVE: 0
    steps:
      # - name: Generate a token for rccl
      #   id: generate-token
      #   uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
      #   with:
      #     app-id: ${{ secrets.APP_ID }}
      #     private-key: ${{ secrets.APP_PRIVATE_KEY }}
      #     owner: ${{ github.repository_owner }}

      - name: Checkout rccl repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "ROCm/rccl"
          path: "rccl"

      - name: Checkout rccl-tests repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "ROCm/rccl-tests"
          path: "rccl-tests"
      
      - name: Checkout TheRock repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "ROCm/TheRock"
          path: "TheRock"

      - name: Runner Health Settings
        run: |
          ./TheRock/build_tools/setup_ccache.py \
            --config-preset "github-oss-presubmit" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"
          df -h
          echo "ccache version: $(ccache --version)"
          echo "ccache config:"
          echo "---"
          cat "$CCACHE_CONFIGPATH"
          echo "---"
          ccache -z
          ccache -s -v
          cmake --version
          echo "Installed Python versions:"
          ls -d /opt/python
          echo "python: $(which python), python3: $(which python3)"
          echo "Git version: $(git --version)"
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Fetch sources
        run: |
          ./TheRock/build_tools/fetch_sources.py --jobs 12 --no-include-math-libs

      - name: Install python deps
        run: |
          pip install -r TheRock/requirements.txt
          pip freeze

      - name: Configure Projects
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ADHOCBUILD
          extra_cmake_options: "-DTHEROCK_AMDGPU_FAMILIES=gfx94X-dcgpu -DTHEROCK_USE_EXTERNAL_RCCL=ON -DTHEROCK_RCCL_SOURCE_DIR=../rccl -DTHEROCK_RCCL_TESTS_SOURCE_DIR=../rccl-tests -DUSE_MPI=ON"
          BUILD_DIR: build
        run: |
          python3 TheRock/build_tools/github_actions/build_configure.py

      - name: Build therock-dist
        run: cmake --build TheRock/build --target therock-dist

      - name: Build therock-archives
        run: cmake --build TheRock/build --target therock-archives

      - name: Report
        if: ${{ !cancelled() }}
        run: |
          echo "Full SDK du:"
          echo "------------"
          du -h -d 1 TheRock/build/dist/rocm
          echo "Artifact Archives:"
          echo "------------------"
          ls -lh TheRock/build/artifacts/*.tar.xz
          echo "Artifacts:"
          echo "----------"
          du -h -d 1 TheRock/build/artifacts
          echo "CCache Stats:"
          echo "-------------"
          ccache -s -v
          tail -v -n +1 .ccache/compiler_check_cache/* > TheRock/build/logs/ccache_compiler_check_cache.log

      - name: Configure AWS Credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-artifacts-external

      - name: Create Log archive
        if: always()
        run: |
          python3 TheRock/build_tools/create_log_archive.py \
            --build-dir=TheRock/build

      - name: Create Logs index Files
        if: always()
        run: |
          python3 TheRock/build_tools/github_actions/create_log_index.py \
            --build-dir=TheRock/build \
            --amdgpu-family=${{ env.AMDGPU_FAMILIES }}

      - name: Upload artifacts
        run: |
          python TheRock/build_tools/github_actions/upload_build_artifacts.py \
            --run-id ${{ github.run_id }} \
            --amdgpu-family ${{ env.AMDGPU_FAMILIES }} \
            --build-dir TheRock/build

      - name: Upload Logs
        if: always()
        run: |
          python3 TheRock/build_tools/github_actions/upload_build_logs_to_s3.py \
            --build-dir=TheRock/build \
            --run-id ${{ github.run_id }} \
            --amdgpu-family ${{ env.AMDGPU_FAMILIES }}

      - name: Add Links to Job Summary
        if: always()
        run: |
          python TheRock/build_tools/github_actions/upload_build_summary.py \
            --run-id ${{ github.run_id }} \
            --amdgpu-family ${{ env.AMDGPU_FAMILIES }} \
            --build-dir TheRock/build

  ## WIP - Adding tests once build with TheRock and other submodules work
  multi-node-rccl-test:
    name: "Test multi-node-rccl-tests"
    #needs: [build_test_packages]
    runs-on: vultr-linux-rocm

    steps:
      - name: Run tests on vultr-linux-node
        if: always()
        run: |
          source /home/arravikum/TheRock/.venv/bin/activate
          cd /home/arravikum/cvs
          pytest -vvv --log-file=/tmp/rccl_log.log -s ./tests/rccl/rccl_multinode_cvs.py --cluster_file ./input/cluster.json --config_file ./input/mi300_config.json --html=/var/www/html/cvs/ci_test_report.html --capture=tee-sys --self-contained-html
          