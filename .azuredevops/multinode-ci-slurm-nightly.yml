resources:
  repositories:
  - repository: pipelines_repo
    type: github
    endpoint: ROCm
    name: ROCm/ROCm

variables:
- group: common
- template: /.azuredevops/variables-global.yml@pipelines_repo

trigger: none
pr: none
schedules:
  - cron: "0 5 * 11-3 *"  # 11 PM CST (November - March)
    displayName: "Nightly Build (CST)"
    branches:
      include:
        - develop
    always: false

  - cron: "0 4 * 4-10 *"  # 11 PM CDT (April - October)
    displayName: "Nightly Build (CDT)"
    branches:
      include:
        - develop
    always: false

jobs:
- job: rccl
  timeoutInMinutes: 180
  pool: rocm-ci_rccl_slurm_pool
  workspace:
    clean: all
  steps:
  - task: DeleteFiles@1
    inputs:
      Contents: '**/*'
  - template: ${{ variables.CI_TEMPLATE_PATH }}/steps/checkout.yml@pipelines_repo
    parameters:
      submoduleBehaviour: recursive
  - task: Bash@3
    displayName: Module Sample
    continueOnError: true
    inputs:
      targetType: inline
      script: |
        sbatch --export=ALL --parsable $(Build.SourcesDirectory)/.azuredevops/slurm/sample.sh
        sleep 60
        cat test_module.out
  - task: Bash@3
    displayName: Build Job
    continueOnError: true
    inputs:
      targetType: inline
      script: |
        echo "Submitting build job..."
        mkdir -p $(Build.BinariesDirectory)
        BUILD_JOB_ID=$(sbatch --export=ALL,BINARIES_DIR=$(Build.BinariesDirectory) --parsable $(Build.SourcesDirectory)/.azuredevops/slurm/build.sh)
        echo "Submitted build job: $BUILD_JOB_ID"
        echo "##vso[task.setvariable variable=BUILD_JOB_ID]$BUILD_JOB_ID"

        echo "Waiting for build job to start..."
        while squeue -j $BUILD_JOB_ID 2>/dev/null | grep -q $BUILD_JOB_ID; do
          echo "##[section]Build job $BUILD_JOB_ID is still running..."
          sleep 60
        done

        echo "Waiting for final status via sacct..."
        LOOP_COUNT=0
        MAX_LOOPS=30  # Maximum of 30 loops (30 minutes)
        while true; do
          STATE=$(sacct -j "$BUILD_JOB_ID" --format=JobID,State --noheader | awk '$1 ~ /\.batch$/ { print $2; exit }' | xargs)
          echo "##[section]Build job state: $STATE"
          if [[ "$STATE" == "COMPLETED" ]]; then
            break
          elif [[ "$STATE" =~ ^(FAILED|CANCELLED|TIMEOUT)$ ]]; then
            echo "Build failed with state $STATE"
            break
          fi
          sleep 60
          LOOP_COUNT=$((LOOP_COUNT + 1))
          if [ $LOOP_COUNT -ge $MAX_LOOPS ]; then
            echo "Time limit reached while waiting for final status."
            exit 1  # Exit with an error code if time limit is reached
          fi
        done
  - task: Bash@3
    displayName: Build Logs
    continueOnError: true  # Allow pipeline to continue even if this step "fails"
    inputs:
      targetType: inline
      script: |
        LOG_STDOUT="rccl-build-${BUILD_JOB_ID}.out"
        HAD_ERROR=0

        echo "================================================="
        echo "Output"
        echo "================================================="
        if [[ -f "$LOG_STDOUT" ]]; then
          cat "$LOG_STDOUT"
          if grep -E '(^|\s)(CMake Error|FAILED|error:)' "$LOG_STDOUT"; then
            echo "##vso[task.logissue type=error]Detected build error(s) in log"
            HAD_ERROR=1
          fi
        else
          echo "##vso[task.logissue type=error]No log found"
          HAD_ERROR=1
        fi

        if [[ "$HAD_ERROR" -eq 1 ]]; then
          echo "##vso[task.complete result=SucceededWithIssues;]Build logs contain error messages"
        else
          echo "Build logs parsed — no critical errors found."
        fi
  - task: Bash@3
    displayName: Test Job
    continueOnError: true
    inputs:
      targetType: inline
      script: |
        echo "Submitting test job..."
        TEST_JOB_ID=$(sbatch --export=ALL,BINARIES_DIR=$(Build.BinariesDirectory),PIPELINE_WORKSPACE=$(Pipeline.Workspace) --parsable  $(Build.SourcesDirectory)/.azuredevops/slurm/test.sh)
        echo "Submitted test job: $TEST_JOB_ID"
        echo "##vso[task.setvariable variable=TEST_JOB_ID]$TEST_JOB_ID"

        echo "Waiting for test job to start..."
        while squeue -j $TEST_JOB_ID 2>/dev/null | grep -q $TEST_JOB_ID; do
          echo "##[section]Test job $TEST_JOB_ID is still running..."
          sleep 60
        done

        echo "Waiting for final status via sacct..."
        LOOP_COUNT=0
        MAX_LOOPS=120  # Maximum of 120 loops (120 minutes)
        while true; do
          STATE=$(sacct -j "$TEST_JOB_ID" --format=JobID,State --noheader | awk '$1 ~ /\.batch$/ { print $2; exit }' | xargs)
          echo "##[section]Test job state: $STATE"
          if [[ "$STATE" == "COMPLETED" ]]; then
            break
          elif [[ "$STATE" =~ ^(FAILED|CANCELLED|TIMEOUT)$ ]]; then
            echo "Test failed with state $STATE"
            break
          fi
          sleep 60
          LOOP_COUNT=$((LOOP_COUNT + 1))
          if [ $LOOP_COUNT -ge $MAX_LOOPS ]; then
            echo "Time limit reached while waiting for final status."
            exit 1  # Exit with an error code if time limit is reached
          fi
        done
  - task: Bash@3
    displayName: Test Log
    inputs:
      targetType: inline
      script: |
        echo "================================================="
        echo "Output"
        echo "================================================="
        cat rccl-test-${TEST_JOB_ID}.out || echo "No log found"
  - task: PublishTestResults@2
    displayName: 'Publish Results'
    condition: succeededOrFailed()
    inputs:
      searchFolder: $(Pipeline.Workspace)
      testResultsFormat: JUnit
      testResultsFiles: '**/test_output.xml'
