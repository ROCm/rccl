resources:
  repositories:
  - repository: pipelines_repo
    type: github
    endpoint: ROCm
    name: ROCm/ROCm

variables:
- group: common
- template: /.azuredevops/variables-global.yml@pipelines_repo

trigger: none
pr: none
schedules:
  - cron: "0 5 * 11-3 *"  # 11 PM CST (November - March)
    displayName: "Nightly Build (CST)"
    branches:
      include:
        - develop
    always: false

  - cron: "0 4 * 4-10 *"  # 11 PM CDT (April - October)
    displayName: "Nightly Build (CDT)"
    branches:
      include:
        - develop
    always: false

jobs:
- job: rccl
  timeoutInMinutes: 180
  pool: rocm-ci_rccl_slurm_pool
  workspace:
    clean: all
  steps:
  - task: DeleteFiles@1
    inputs:
      Contents: '**/*'
  - template: ${{ variables.CI_TEMPLATE_PATH }}/steps/checkout.yml@pipelines_repo
    parameters:
      submoduleBehaviour: recursive
  - task: Bash@3
    displayName: Build Job
    inputs:
      targetType: inline
      script: |
        echo "Submitting build job..."
        BUILD_JOB_ID=$(sbatch --parsable $(Build.SourcesDirectory)/.azuredevops/slurm/build.sh)
        echo "Submitted build job: $BUILD_JOB_ID"
        echo "##vso[task.setvariable variable=BUILD_JOB_ID]$BUILD_JOB_ID"

        echo "Waiting for build job to start..."
        while squeue -j $BUILD_JOB_ID 2>/dev/null | grep -q $BUILD_JOB_ID; do
          echo "##[section]Build job $BUILD_JOB_ID is still running..."
          sleep 60
        done

        echo "Waiting for final status via sacct..."
        while true; do
          STATE=$(sacct -j $BUILD_JOB_ID --format=State --noheader | awk '{print $1}')
          echo "##[section]Build job state: $STATE"
          if [[ "$STATE" == "COMPLETED" ]]; then
            break
          elif [[ "$STATE" =~ ^(FAILED|CANCELLED|TIMEOUT)$ ]]; then
            echo "Build failed with state $STATE"
            exit 1
          fi
          sleep 60
        done
  - task: Bash@3
    displayName: Build Logs
    inputs:
      targetType: inline
      script: |
        cat rccl-build-${BUILD_JOB_ID}.out || echo "No stdout log found"
        cat rccl-build-${BUILD_JOB_ID}.err || echo "No stderr log found"
  - task: Bash@3
    displayName: Test Job
    inputs:
      targetType: inline
      script: |
        echo "Submitting test job..."
        TEST_JOB_ID=$(sbatch --parsable $(Build.SourcesDirectory)/.azuredevops/slurm/test.sh)
        echo "Submitted test job: $TEST_JOB_ID"
        echo "##vso[task.setvariable variable=TEST_JOB_ID]$TEST_JOB_ID"

        echo "Waiting for test job to start..."
        while squeue -j $TEST_JOB_ID 2>/dev/null | grep -q $TEST_JOB_ID; do
          echo "##[section]Test job $TEST_JOB_ID is still running..."
          sleep 60
        done

        echo "Waiting for final status via sacct..."
        while true; do
          STATE=$(sacct -j $TEST_JOB_ID --format=State --noheader | awk '{print $1}')
          echo "##[section]Test job state: $STATE"
          if [[ "$STATE" == "COMPLETED" ]]; then
            break
          elif [[ "$STATE" =~ ^(FAILED|CANCELLED|TIMEOUT)$ ]]; then
            echo "Test failed with state $STATE"
            exit 1
          fi
          sleep 60
        done
  - task: Bash@3
    displayName: Test Logs
    inputs:
      targetType: inline
      script: |
        cat rccl-test-${TEST_JOB_ID}.out || echo "No stdout log found"
        cat rccl-test-${TEST_JOB_ID}.err || echo "No stderr log found"
  - task: PublishPipelineArtifact@1
    displayName: Upload test XML results
    inputs:
      targetPath: '$(Build.SourcesDirectory)/build/test/test_output.xml'
      artifact: test-results
      condition: succeededOrFailed()
