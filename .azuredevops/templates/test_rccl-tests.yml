steps:
  - task: Bash@3
    displayName: RCCL-Tests
    env:
      BINARIES_DIR: $(Build.BinariesDirectory)
      PIPELINE_WORKSPACE: $(Pipeline.Workspace)
    inputs:
      targetType: inline
      script: |
        set -Eeuo pipefail

        # Path to your new runner script that **itself** handles SLURM submitting/waiting
        RUN_SCRIPT="$(Build.SourcesDirectory)/rccl/.azuredevops/slurm/test_rccl-tests.sh"

        echo "Launching test runner script: ${RUN_SCRIPT}"
        if [[ ! -x "${RUN_SCRIPT}" ]]; then
          echo "Script not executable, chmod +x"
          chmod +x "${RUN_SCRIPT}"
        fi

        # Hand off control; this script should do all SLURM work and exit non-zero on failure
        "${RUN_SCRIPT}"

  - task: Bash@3
    displayName: Test Logs
    condition: always()
    inputs:
      targetType: inline
      script: |
        cat rccl-tests-${TEST_JOB_ID}.out || echo "No log found"
